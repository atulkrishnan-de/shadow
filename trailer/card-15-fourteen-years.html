<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW — Card 15 · Fourteen Years</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card-15 .line-main {
      font-size: clamp(1.8rem, 3.6vw, 3.8rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-15 .second-line {
      animation-delay: 4.0s;
    }
    .card-15 .big-sep {
      height: 0;
      margin: 2.4em auto;
    }
  </style>
</head>
<body>
<div class="card card-15">

  <p class="line line-main d0">Nothing in here has changed<br>in fourteen years.</p>

  <div class="big-sep"></div>

  <p class="line line-main second-line">Everything out there has.</p>

  <div class="scanlines"></div>
  <div class="grain"></div>
  <span class="card-tag">card 15 · fourteen years</span>
</div>
</body>
</html>
