<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW — Card 06 · Shadows</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .shadow-count {
      font-family: var(--mono);
      font-size: clamp(1.4rem, 2.6vw, 2.6rem);
      font-weight: 700;
      color: var(--violet);
      letter-spacing: 0.1em;
      text-shadow: 0 0 30px rgba(179,136,255,0.5);
    }
  </style>
</head>
<body>
<div class="card">

  <p class="line line-main d0">A violet figure is already walking<br>the line you walked.</p>

  <p class="line line-sub d1">It reaches the plate. Settles its weight. Does not look up.</p>

  <div class="sep d2"></div>

  <p class="line line-main d3">Not ghosts. Not metaphors.</p>
  <p class="line line-accent d4">Product.</p>

  <div class="sep d5"></div>

  <p class="line shadow-count d6">SHADOWS × 1</p>
  <p class="line line-mono d7">attempt 2</p>

  <div class="scanlines"></div>
  <div class="grain"></div>
  <span class="card-tag">card 06 · shadows</span>
</div>
</body>
</html>
