<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW — Card 12 · The Drawing</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .drawing-desc {
      font-family: var(--sans);
      font-size: clamp(1.1rem, 2vw, 2rem);
      font-weight: 400;
      color: var(--warm);
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1.2s ease forwards;
    }
  </style>
</head>
<body>
<div class="card">

  <p class="line line-main d0">A drawing, in crayon.</p>

  <div class="sep d1"></div>

  <p class="drawing-desc d2">Two figures. One of them is much taller.</p>

  <div class="sep d3"></div>

  <p class="line line-sub d4">She drew it at the kitchen table,<br>the morning before he left for the plant.</p>

  <p class="line line-sub d5">She is not little any more.</p>

  <div class="sep d6"></div>

  <p class="line line-accent d7">Your past selves can hold a door open for you.</p>
  <p class="line line-sub d8">They cannot put you back together.</p>

  <div class="scanlines"></div>
  <div class="grain"></div>
  <span class="card-tag">card 12 · the drawing</span>
</div>
</body>
</html>
